name: Build Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests pyinstaller

      - name: Build
        run: pyinstaller --onefile --windowed --clean --name chandiaeoi gapo_comment.py

      - uses: actions/upload-artifact@v4
        with:
          name: chandiaeoi-windows
          path: dist/chandiaeoi.exe
